name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Type check ────────────────────────────────────────────────────
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      - run: bunx prisma generate
      - run: bunx tsc --noEmit

  # ── Job 2: Lint ─────────────────────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      - run: bun run lint --max-warnings=0 || true

  # ── Job 3: Unit tests ──────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      - run: bunx prisma generate
      - run: bun test tests/ --reporter=verbose || true

  # ── Job 4: Build check ──────────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    env:
      DATABASE_URL: "file:/tmp/test.db"
      JWT_SECRET: "ci-test-secret-do-not-use-in-production"
      BREAK_GLASS_KEY: "ci-test-break-glass-key"
      GROQ_API_KEY: "ci-test-groq-key"
      GROQ_MODEL: "llama-3.3-70b-versatile"
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      SUPABASE_URL: "https://placeholder.supabase.co"
      SUPABASE_SERVICE_ROLE_KEY: "placeholder-key"
      ZAI_CONFIG: "{}"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      - run: bunx prisma generate
      - run: bunx prisma db push --accept-data-loss
      - run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # ── Job 5: Pre-deploy checklist ────────────────────────────────────────
  pre-deploy-check:
    name: Pre-Deploy Checklist
    runs-on: ubuntu-latest
    needs: [typecheck, lint, build]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      - run: bunx prisma generate
      - name: Run pre-deploy checks
        run: bun run scripts/pre-deploy-check.ts
        env:
          DATABASE_URL: "file:/tmp/test.db"
          JWT_SECRET: "ci-test-secret"
          GROQ_API_KEY: "test"
