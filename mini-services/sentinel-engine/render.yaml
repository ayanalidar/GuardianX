services:
  - type: web
    name: guardianx-engine
    env: docker
    dockerfilePath: ./Dockerfile.simple
    dockerContext: .
    healthCheckPath: /healthz
    plan: free
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://ekjsieovspkuqdjhxwct.supabase.co
      - key: SUPABASE_URL
        value: https://ekjsieovspkuqdjhxwct.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: SUPABASE_SERVICE_ROLE_KEY_PLACEHOLDER
      - key: PORT
        value: 3003
      - key: ZAI_CONFIG
        value: '{"baseUrl":"https://internal-api.z.ai/v1","apiKey":"Z.ai"}'
